[project]
name = "quant-intelligence-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alpaca-py>=0.44.0",
    "arch>=8.0.0",
    "catboost>=1.2.10",
    "cvxpy>=1.9.2",
    "duckdb>=1.5.5",
    "dvc>=3.67.1",
    "empyrical-reloaded>=0.5.12",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.141.1",
    "fredapi>=0.5.2",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "langgraph>=1.2.11",
    "lightgbm>=4.7.0",
    "litellm>=1.98.0",
    "llama-index>=0.14.24",
    "matplotlib>=3.11.1",
    "mlflow>=1.27.0",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pandas-market-calendars>=5.4.0",
    "pingouin>=0.6.1",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "prefect>=3.8.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.31.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "quantlib>=1.43",
    "quantstats>=0.0.81",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.0",
    "spacy>=3.8.16",
    "statsmodels>=0.15.0",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "uvicorn>=0.52.4",
    "vectorbt>=1.1.0",
    "xgboost>=3.4.1",
    "yfinance>=1.7.0",
]

[project.scripts]
quant-intelligence-engine = "quant_intelligence_engine:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.167.1",
    "line-profiler>=5.0.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "py-spy>=0.4.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "scalene>=2.3.0",
]
